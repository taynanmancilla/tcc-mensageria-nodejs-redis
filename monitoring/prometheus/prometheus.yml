global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "nodejs-app"
    static_configs:
      - targets: ["host.docker.internal:3001"]
    # Nota: este target ficará indisponível (DOWN) até que a aplicação
    # Node.js implemente o endpoint /metrics via prom-client.
    # Esse comportamento é esperado nesta fase do projeto.
